<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1A1A1A; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  flex-direction: column;
  background: #0D0D0D;
}
.header {
  padding: 40pt 50pt 20pt 50pt;
}
.label {
  color: #8B1538;
  font-size: 10pt;
  letter-spacing: 3pt;
}
h2 {
  color: #FFFFFF;
  font-size: 36pt;
  font-weight: 700;
  margin: 10pt 0 0 0;
}
.grid {
  display: flex;
  flex-wrap: wrap;
  padding: 0 40pt;
  gap: 15pt;
}
.card {
  width: 200pt;
  background: #1A1A1A;
  padding: 25pt;
  border-left: 3pt solid #8B1538;
}
.card-title {
  color: #FFFFFF;
  font-size: 13pt;
  font-weight: 600;
  margin: 0 0 8pt 0;
}
.card-desc {
  color: #666666;
  font-size: 10pt;
  line-height: 1.4;
}
</style>
</head>
<body>
<div class="header">
  <p class="label">ПРЕИМУЩЕСТВА</p>
  <h2>Почему мы</h2>
</div>
<div class="grid">
  <div class="card">
    <p class="card-title">Городская черта</p>
    <p class="card-desc">Участки под застройку в черте Красноярска</p>
  </div>
  <div class="card">
    <p class="card-title">IV-V класс опасности</p>
    <p class="card-desc">Разрешённые виды производств</p>
  </div>
  <div class="card">
    <p class="card-title">Своя УК</p>
    <p class="card-desc">Собственная управляющая компания</p>
  </div>
  <div class="card">
    <p class="card-title">10 месяцев</p>
    <p class="card-desc">Срок строительства под ключ</p>
  </div>
  <div class="card">
    <p class="card-title">Мощности</p>
    <p class="card-desc">Электро- и водоснабжение</p>
  </div>
  <div class="card">
    <p class="card-title">Гибкие условия</p>
    <p class="card-desc">Лояльная ценовая политика</p>
  </div>
</div>
</body>
</html>
