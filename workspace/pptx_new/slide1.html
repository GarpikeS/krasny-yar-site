<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1A1A1A; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  position: relative;
}
.bg {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: #0D0D0D;
}
.accent {
  position: absolute;
  bottom: 0; left: 0;
  width: 8pt; height: 100%;
  background: #8B1538;
}
.content {
  position: relative;
  z-index: 2;
  display: flex;
  flex-direction: column;
  justify-content: center;
  margin-left: 60pt;
  margin-top: 80pt;
}
h1 {
  color: #FFFFFF;
  font-size: 56pt;
  font-weight: 700;
  margin: 0;
  letter-spacing: 2pt;
}
.subtitle {
  color: #8B1538;
  font-size: 18pt;
  font-weight: 400;
  margin-top: 20pt;
  letter-spacing: 4pt;
}
.tagline {
  color: #888888;
  font-size: 14pt;
  margin-top: 40pt;
  max-width: 400pt;
  line-height: 1.6;
}
.logo-area {
  position: absolute;
  bottom: 40pt;
  right: 50pt;
}
.logo-text {
  color: #FFFFFF;
  font-size: 11pt;
  text-align: right;
}
</style>
</head>
<body>
<div class="bg"></div>
<div class="accent"></div>
<div class="content">
  <p class="subtitle">BUILD-TO-SUIT</p>
  <h1>КРАСНЫЙ ЯР</h1>
  <p class="tagline">Строительство современных производственных и складских помещений под ключ в Красноярске</p>
</div>
<div class="logo-area">
  <p class="logo-text">ИНДУСТРИАЛЬНЫЙ ПАРК</p>
</div>
</body>
</html>
