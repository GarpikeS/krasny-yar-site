<!DOCTYPE html>
<html>
<head>
<style>
html { background: #1A1A1A; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #0D0D0D;
}
.left {
  width: 350pt;
  background: #8B1538;
  padding: 50pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.cta {
  color: #FFFFFF;
  font-size: 28pt;
  font-weight: 700;
  margin: 0 0 20pt 0;
  line-height: 1.3;
}
.cta-desc {
  color: rgba(255,255,255,0.7);
  font-size: 12pt;
  line-height: 1.6;
}
.keyword {
  background: #FFFFFF;
  margin-top: 30pt;
  padding: 15pt 25pt;
  display: inline-block;
}
.keyword-text {
  color: #8B1538;
  font-size: 14pt;
  font-weight: 700;
  letter-spacing: 2pt;
}
.right {
  flex: 1;
  padding: 50pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.contact-label {
  color: #888888;
  font-size: 10pt;
  letter-spacing: 2pt;
  margin-bottom: 15pt;
}
.contact-name {
  color: #FFFFFF;
  font-size: 20pt;
  font-weight: 600;
  margin: 0 0 5pt 0;
}
.contact-role {
  color: #666666;
  font-size: 11pt;
  margin-bottom: 30pt;
}
.contact-phone {
  color: #FFFFFF;
  font-size: 18pt;
  font-weight: 500;
  margin: 0 0 10pt 0;
}
.contact-email {
  color: #8B1538;
  font-size: 13pt;
}
</style>
</head>
<body>
<div class="left">
  <p class="cta">Готовы обсудить ваш проект</p>
  <p class="cta-desc">Предложим выгодные условия по продаже и аренде помещений</p>
  <div class="keyword">
    <p class="keyword-text">СТРОЙКА</p>
  </div>
</div>
<div class="right">
  <p class="contact-label">КОНТАКТЫ</p>
  <p class="contact-name">Константин Семенов</p>
  <p class="contact-role">Коммерческий директор</p>
  <p class="contact-phone">+7 (391) 989-99-49</p>
  <p class="contact-phone">+7 924 042-49-00</p>
  <p class="contact-email">office@kr-yar.com</p>
</div>
</body>
</html>
