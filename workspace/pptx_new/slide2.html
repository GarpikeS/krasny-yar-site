<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #FAFAFA;
}
.left {
  width: 320pt;
  padding: 50pt;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.right {
  width: 350pt;
  background: #1A1A1A;
  display: flex;
  align-items: center;
  justify-content: center;
}
.label {
  color: #8B1538;
  font-size: 10pt;
  letter-spacing: 3pt;
  margin-bottom: 15pt;
}
h2 {
  color: #1A1A1A;
  font-size: 32pt;
  font-weight: 700;
  margin: 0 0 30pt 0;
  line-height: 1.2;
}
.item {
  margin-bottom: 25pt;
}
.num {
  color: #8B1538;
  font-size: 24pt;
  font-weight: 700;
}
.item-text {
  color: #333333;
  font-size: 12pt;
  margin-top: 5pt;
}
.bts-text {
  color: #FFFFFF;
  font-size: 48pt;
  font-weight: 700;
  text-align: center;
}
.bts-sub {
  color: #888888;
  font-size: 11pt;
  text-align: center;
  margin-top: 10pt;
}
</style>
</head>
<body>
<div class="left">
  <p class="label">ФОРМАТ РАБОТЫ</p>
  <h2>Режим одного окна</h2>
  <div class="item">
    <p class="num">01</p>
    <p class="item-text">Земельный участок нужной площади</p>
  </div>
  <div class="item">
    <p class="num">02</p>
    <p class="item-text">Полноценный проект под ваши задачи</p>
  </div>
  <div class="item">
    <p class="num">03</p>
    <p class="item-text">Строительство за 10 месяцев</p>
  </div>
</div>
<div class="right">
  <div>
    <p class="bts-text">BTS</p>
    <p class="bts-sub">BUILD TO SUIT</p>
  </div>
</div>
</body>
</html>
