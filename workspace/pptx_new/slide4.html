<!DOCTYPE html>
<html>
<head>
<style>
html { background: #FFFFFF; }
body {
  width: 720pt; height: 405pt; margin: 0; padding: 0;
  font-family: Arial, sans-serif;
  display: flex;
  background: #FAFAFA;
}
.content {
  width: 100%;
  padding: 50pt;
  display: flex;
  flex-direction: column;
}
.label {
  color: #8B1538;
  font-size: 10pt;
  letter-spacing: 3pt;
}
h2 {
  color: #1A1A1A;
  font-size: 36pt;
  font-weight: 700;
  margin: 10pt 0 40pt 0;
}
.options {
  display: flex;
  gap: 30pt;
}
.option {
  flex: 1;
  background: #FFFFFF;
  padding: 30pt;
  border: 1pt solid #E0E0E0;
}
.opt-num {
  color: #8B1538;
  font-size: 32pt;
  font-weight: 700;
  margin: 0;
}
.opt-title {
  color: #1A1A1A;
  font-size: 14pt;
  font-weight: 600;
  margin: 15pt 0 10pt 0;
}
.opt-desc {
  color: #666666;
  font-size: 11pt;
  line-height: 1.5;
}
.highlight {
  background: #8B1538;
  margin-top: 30pt;
  padding: 20pt 30pt;
  display: flex;
  align-items: center;
  gap: 20pt;
}
.hl-num {
  color: #FFFFFF;
  font-size: 28pt;
  font-weight: 700;
}
.hl-text {
  color: #FFFFFF;
  font-size: 12pt;
}
</style>
</head>
<body>
<div class="content">
  <p class="label">ФОРМАТЫ</p>
  <h2>Варианты сотрудничества</h2>
  <div class="options">
    <div class="option">
      <p class="opt-num">01</p>
      <p class="opt-title">Аренда</p>
      <p class="opt-desc">Строим и сдаём в аренду готовые помещения</p>
    </div>
    <div class="option">
      <p class="opt-num">02</p>
      <p class="opt-title">BTS Продажа</p>
      <p class="opt-desc">Продаём участок и строим под ваши цели</p>
    </div>
    <div class="option">
      <p class="opt-num">03</p>
      <p class="opt-title">Готовые</p>
      <p class="opt-desc">Продажа готовых помещений</p>
    </div>
  </div>
  <div class="highlight">
    <p class="hl-num">480 м²</p>
    <p class="hl-text">Минимальная площадь помещения. Гибкий подход к делению зданий на блоки</p>
  </div>
</div>
</body>
</html>
